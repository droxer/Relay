name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  UV_LOCKED: "true"

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: uv sync --project backend --locked --extra dev
      - name: Lint Python
        run: uv run --project backend ruff check backend
      - name: Typecheck Python
        working-directory: backend
        run: uv run mypy
      - name: Build shared types
        run: npm run build -w relay-core
      - name: Typecheck packages and tests
        run: npx --no-install tsc -p packages/tsconfig.json --noEmit
      - name: Typecheck web
        run: npx --no-install tsc -p web/tsconfig.json --noEmit
      - name: Lint web
        run: npm run lint -w web
      - name: Lint CSS
        run: npm run lint:css -w web

  typescript-tests:
    name: TypeScript and web tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test vendored dependency fixes
        run: npm run test:security-dependencies
      - name: Build and test TypeScript and web
        run: npm run test:ts

  python-tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RELAY_TEST_DATABASE_URL: postgresql+psycopg://relay:relay@localhost:5432/relay_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked --extra dev
      - name: Run Python tests including PostgreSQL migrations
        working-directory: backend
        run: uv run pytest
