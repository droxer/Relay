name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  UV_LOCKED: "true"

jobs:
  lint:
    name: Pre-commit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: uv sync --project backend --locked --extra dev
      - name: Build shared types
        run: npm run build -w relay-core
      - name: Run all pre-commit hooks
        run: uv run --project backend --extra dev pre-commit run --all-files --show-diff-on-failure

  typescript-tests:
    name: TypeScript and web tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test vendored dependency fixes
        run: npm run test:security-dependencies
      - name: Build and test TypeScript and web
        run: npm run test:ts

  concurrency-e2e:
    name: Browser/backend/daemon concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
      - run: uv sync --project backend --locked --extra dev
      - name: Install Chromium
        run: |
          # The hosted runner's Azure mirror intermittently fails DNS resolution.
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          npx playwright install --with-deps chromium
        working-directory: web
      - name: Exercise real backend and daemon through the browser
        run: npm run test:e2e:concurrency -w web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: concurrency-e2e-traces
          path: web/test-results/
          retention-days: 7

  python-tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RELAY_TEST_DATABASE_URL: postgresql+psycopg://relay:relay@localhost:5432/relay_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked --extra dev
      - name: Run Python tests including PostgreSQL migrations
        working-directory: backend
        run: uv run pytest
