<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 6 184 52" role="img" aria-label="Relay" shape-rendering="geometricPrecision">
  <title>Relay</title>
  <!-- Standalone wordmark: RelayMark's interlocking baton-exchange tracks beside
       the Relay wordmark in Swiss neo-grotesk proportions. The ink and both
       tracks follow the viewer's color scheme, using each register's palette
       ink-1, palette brand-lead (burnished bronze: a person handing work on),
       and palette live (signal blue: an agent carrying it forward). -->
  <style>
    :root {
      color-scheme: light dark;
      --relay-logo-ink: #141413;
      --relay-logo-lead: #845734;
      --relay-logo-trail: #2356c4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --relay-logo-ink: #f2f2f0;
        --relay-logo-lead: #c8966e;
        --relay-logo-trail: #82b4f5;
      }
    }
  </style>
