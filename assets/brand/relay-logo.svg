<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 8 172 50" role="img" aria-label="Relay" shape-rendering="geometricPrecision">
  <title>Relay</title>
  <!-- Standalone wordmark: RelayMark's chevrons, unscaled, beside the name
       in the sans stack at weight 500. The ink and both chevrons follow the
       viewer's color scheme, using each register's
       palette ink-1, palette brand-lead (lead chevron: a person handing work
       on) and palette live (trailing chevron: an agent carrying it on). -->
  <style>
    :root {
      color-scheme: light dark;
      --relay-logo-ink: #27333b;
      --relay-logo-lead: #b84400;
      --relay-logo-trail: #2457c5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --relay-logo-ink: #e3ebf1;
        --relay-logo-lead: #ff8a3d;
        --relay-logo-trail: #91b9f2;
      }
    }
  </style>
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 14 L32 32 L12 50" stroke="var(--relay-logo-lead, #b84400)"/>
    <path d="M32 14 L52 32 L32 50" stroke="var(--relay-logo-trail, #2457c5)"/>
  </g>
  <text x="74" y="47"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', Arial, sans-serif"
        font-size="42"
        font-weight="500"
        letter-spacing="0"
        fill="var(--relay-logo-ink, #27333b)">Relay</text>
</svg>
