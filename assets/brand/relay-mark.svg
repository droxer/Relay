<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Relay" shape-rendering="geometricPrecision">
  <title>Relay</title>
  <!-- Standalone app-icon badge (light register): canvas, hairline, and the
       handoff, baton orange lead chevron (palette brand-lead, a person handing work on),
       blue trailing chevron (palette live, an agent carrying it on). Source for
       apple-touch-icon.png. Values are the light register's tokens; the chevrons
       are RelayMark's geometry at 0.7, centred on the badge. -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="#ffffff"/>
  <rect x="4" y="4" width="56" height="56" rx="15" fill="none" stroke="#d9d9d9" stroke-width="1"/>
  <g fill="none" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 19.4 L32 32 L18 44.6" stroke="#b84400"/>
    <path d="M32 19.4 L46 32 L32 44.6" stroke="#2457c5"/>
  </g>
</svg>
