[project]
name = "relay"
version = "0.1.0"
description = "Relay backend control plane in Python"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.12"
dependencies = [
  "croniter>=6.0.0",
  "fastapi>=0.128.0",
  "loguru>=0.7.0",
  "pydantic>=2.12.0",
  "psycopg>=3.2.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.38.0",
  "cryptography>=50.0.0",
  "httpx>=0.28.1",
  "PyYAML>=6.0.3",
]

[project.optional-dependencies]
migration = [
  "alembic>=1.17.0",
]
# Cloudflare R2 (S3-compatible) blob storage, selected with RELAY_BLOB_STORE=r2.
r2 = [
  "boto3>=1.36.0",
]
dev = [
  "alembic>=1.17.0",
  "mypy>=1.18.0",
  "pre-commit>=4.0.0",
  "pytest>=9.0.0",
  "ruff>=0.16.0",
]

[project.scripts]
relay = "relay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: requires a live Postgres database",
  "integration: starts backend, daemon, or client processes",
  "slow: longer-running filesystem or process tests",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# Correctness-first: pyflakes, syntax/IO errors, bugbear, async blocking calls,
# blind excepts (each needs a reason), and py312 idioms that ruff can autofix.
select = ["E4", "E7", "E9", "F", "B", "PLE", "ASYNC", "BLE", "UP017", "UP035", "UP012"]
ignore = [
  "B008",  # FastAPI's Depends()/Body() defaults are the framework idiom.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B017", "BLE001", "ASYNC"]

[tool.mypy]
python_version = "3.12"
files = ["relay"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Typed boundaries first: protocols, settings, and the wiring are checked
# strictly by the default rules; untyped function bodies are still checked.
check_untyped_defs = true
