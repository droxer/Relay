<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Relay" shape-rendering="geometricPrecision">
  <title>Relay</title>
  <!-- App icon. The handoff: the lead chevron is the baton orange (palette
       brand-lead), a person handing work on; the trailing chevron is the
       palette live blue, an agent carrying it on. One register for every
       viewer: the tile is black and full-bleed, the strokes bold, so the
       mark reads at 16px on a light tab strip and a dark one alike — a badge
       that followed the color scheme dissolved into a strip of its own tone.
       Values are FAVICON_INK / FAVICON_PATHS in faviconState.ts; the
       signed-in app redraws it with only the acting half lit. -->
  <rect width="64" height="64" rx="14" fill="#000000"/>
  <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 16 L31 32 L15 48" stroke="#ff8a3d"/>
    <path d="M33 16 L49 32 L33 48" stroke="#6aa6ff"/>
  </g>
</svg>
