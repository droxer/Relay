<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Relay" shape-rendering="geometricPrecision">
  <title>Relay</title>
  <!-- App icon (dark default): ink-deep canvas + cobalt lead chevron. Cobalt is
       the brand accent — the register-invariant action token — so the mark matches
       the product's primary CTA. At 16px the icon's job is to identify Relay,
       and a neutral chevron on a neutral square vanishes in a tab strip. -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="#0a1317"/>
  <g fill="none" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 20 L36 32 L22 44" stroke="#0064e0"/>
    <path d="M36 20 L50 32 L36 44" stroke="#ffffff" opacity="0.45"/>
  </g>
</svg>
