<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12171b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#e9eef2" media="(prefers-color-scheme: light)">
  <title>Relay · Offline</title>
  <style>
    :root {
      color-scheme: dark light;
      --surface: #12171b;
      --ink: #edf2f6;
      --muted: #bacbd7;
      --action: #d3e0e9;
      --action-hover: #e3ebf1;
      --on-action: #23313b;
      --signature: #ff8a3d;
      --live: #91b9f2;
      background: var(--surface);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --surface: #e9eef2;
        --ink: #141f27;
        --muted: #3a4b55;
        --action: #364b59;
        --action-hover: #475e6d;
        --on-action: #ffffff;
        --signature: #b84400;
        --live: #2457c5;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: max(32px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
    main { width: 100%; max-width: 400px; }
    svg { display: block; margin-bottom: 32px; }
    h1 { margin: 0 0 12px; font-size: 28px; font-weight: 600; line-height: 1.2; letter-spacing: -0.03em; }
    p { margin: 0 0 28px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    button { min-height: 44px; padding: 10px 20px; border: 0; border-radius: 6px; font: inherit; font-weight: 500; background: var(--action); color: var(--on-action); cursor: pointer; }
    button:hover { background: var(--action-hover); }
    button:focus-visible { outline: 2px solid var(--signature); outline-offset: 2px; }
    ::selection { background: var(--action); color: var(--on-action); }
  </style>
</head>
<body>
  <main>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48" role="img" aria-label="Relay" shape-rendering="geometricPrecision">
      <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 14 L32 32 L12 50" stroke="var(--signature)"/>
        <path d="M32 14 L52 32 L32 50" stroke="var(--live)"/>
      </g>
    </svg>
    <h1 id="heading">You’re offline</h1>
    <p id="message">Reconnect to open your workspace. Relay needs a connection to load your threads and tasks.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    try {
      var language = localStorage.getItem("relay-web.language") || navigator.language;
      if (/^zh/i.test(language)) {
        document.documentElement.lang = "zh-CN";
        document.title = "Relay · 离线";
        document.getElementById("heading").textContent = "你已离线";
        document.getElementById("message").textContent = "请连接网络以打开工作区。Relay 需要网络连接才能加载对话和任务。";
        document.getElementById("retry").textContent = "重试";
      }
    } catch (_) {}
    document.getElementById("retry").addEventListener("click", function () { location.reload(); });
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
