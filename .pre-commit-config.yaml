default_stages: [pre-commit]
default_language_version:
  python: python3.12
exclude: '^(\.claude/|\.codegraph/|\.cursor/|\.git/|\.next/|\.oci/|\.pytest_cache/|\.relay/|\.ruff_cache/|\.uv-cache/|__pycache__/|backend/\.venv/|dist/|node_modules/|packages/\.relay/|web/\.next/|web/out/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-ast
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        name: ruff (backend)
        files: ^backend/
        args: ['--config', 'backend/pyproject.toml']

  - repo: local
    hooks:
      - id: uv-lock-check
        name: Check uv.lock is up to date
        entry: uv
        args: ['lock', '--project', 'backend', '--locked']
        language: system
        files: ^backend/pyproject\.toml$
        pass_filenames: false
        require_serial: true

      - id: mypy-backend
        name: mypy (backend)
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        types: [python]
        files: ^backend/relay/
        pass_filenames: false
        require_serial: true

      - id: typecheck-packages
        name: TypeScript typecheck (packages)
        entry: ./node_modules/.bin/tsc
        args: ['-p', 'packages/tsconfig.json', '--noEmit']
        language: system
        types_or: [ts, tsx]
        files: ^(packages|web/tests)/
        pass_filenames: false

      - id: typecheck-web
        name: TypeScript typecheck (web)
        entry: ./node_modules/.bin/tsc
        args: ['-p', 'web/tsconfig.json', '--noEmit']
        language: system
        types_or: [ts, tsx]
        files: ^web/
        pass_filenames: false

      - id: lint-css-web
        name: stylelint (web design tokens)
        entry: npm run lint:css --workspace web
        language: system
        types_or: [css]
        files: ^web/src/styles/
        pass_filenames: false
